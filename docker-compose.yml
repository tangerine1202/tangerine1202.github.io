# Production: blog.alans.dev. The Cloudflare tunnel routes that hostname straight to
# http://meanwhile:80 on the caddy network — not through Caddy — so the blog hostname
# can reach this container and nothing else. Deploy with ./deploy.sh.
services:
  meanwhile:
    build:
      context: .
      # Docker's bridge network is ~60x slower than the host here (NAT over Wi-Fi), which
      # stalls apt-get; host networking is only for the build, the container runs on caddy.
      network: host
    image: meanwhile:latest
    restart: unless-stopped
    container_name: meanwhile
    hostname: meanwhile
    networks:
      - caddy

networks:
  caddy:
    external: true
